# CI: main에 push하거나 PR을 올리면 GitHub이 빌려주는 컴퓨터에서 전체 테스트를 자동 실행
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 테스트에 필요한 MySQL/Redis를 컨테이너로 띄움
    # (contextLoads, SecurityConfigTest는 스프링을 실제로 띄워 DB/Redis에 연결함)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password    # CI 컴퓨터 안에서만 쓰고 버려지는 테스트 DB 비밀번호
          MYSQL_DATABASE: safetyparis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379

    # application-dev.yml(기본 프로필)이 읽는 환경변수 - .env는 gitignore라 CI엔 없으므로 여기서 지정
    env:
      DB_PASSWORD: ci-test-password

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle            # Gradle 의존성을 캐시해서 다음 실행부터 빠르게

      # 실제 운영 키를 쓰지 않고 실행할 때마다 테스트 전용 키를 새로 생성 (base64, HS512에 충분한 64바이트)
      - name: 테스트용 JWT 키 생성
        run: echo "JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 GitHub 화면에서 리포트를 내려받아 확인할 수 있게 보관
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
