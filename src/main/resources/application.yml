# 공통 설정 - 개발/운영 모두 같은 값
# 환경마다 다른 값(DB 주소, ddl-auto, SQL 로그 등)은 application-dev.yml / application-prod.yml에 둠
spring:
  profiles:
    # 기본은 개발(dev). 운영 서버에서는 환경변수 SPRING_PROFILES_ACTIVE=prod 로 실행하면 이 값을 덮어씀
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      port: 6379

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 900000       # 15분
  refresh-token-expiration: 259200000   # 3일

server:
  port: 8080
