# CI/CD: main에 push하거나 PR을 올리면 전체 테스트를 자동 실행하고,
#        main push이고 테스트가 통과하면 이미지를 빌드해 EC2에 자동 배포
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 테스트에 필요한 MySQL/Redis를 컨테이너로 띄움
    # (contextLoads, SecurityConfigTest는 스프링을 실제로 띄워 DB/Redis에 연결함)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password    # CI 컴퓨터 안에서만 쓰고 버려지는 테스트 DB 비밀번호
          MYSQL_DATABASE: safetyparis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379

    # application-dev.yml(기본 프로필)이 읽는 환경변수 - .env는 gitignore라 CI엔 없으므로 여기서 지정
    env:
      DB_PASSWORD: ci-test-password

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle            # Gradle 의존성을 캐시해서 다음 실행부터 빠르게

      # 실제 운영 키를 쓰지 않고 실행할 때마다 테스트 전용 키를 새로 생성 (base64, HS512에 충분한 64바이트)
      - name: 테스트용 JWT 키 생성
        run: echo "JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 GitHub 화면에서 리포트를 내려받아 확인할 수 있게 보관
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  # ───────── CD: 테스트 통과 + main push일 때만 배포 (PR에서는 실행 안 함) ─────────
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 배포가 겹치지 않게 - 직전 배포가 끝나기 전에 새 push가 오면 순서대로 실행
    concurrency: production-deploy
    permissions:
      contents: read
      packages: write          # GHCR에 이미지 업로드
    env:
      # GHCR 이미지 이름은 소문자만 허용
      IMAGE: ghcr.io/kimeunseokk/safety-paris-api

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      # EC2는 x86_64라 linux/amd64로 빌드. latest(운영 기본값) + 커밋 해시(되돌리기용) 두 태그로 업로드
      - name: 이미지 빌드 및 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 이미지를 이 저장소와 연결 → 저장소 페이지 Packages에 표시되고 저장소 권한으로 접근 관리
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 서버: 최신 설정(git pull) → GHCR에서 새 이미지 받기 → app만 교체 → 정상 기동 확인
      # GHCR 로그인은 이번 배포 동안만 유효한 GITHUB_TOKEN으로 하고, 끝나면 로그아웃해서 서버에 자격증명을 남기지 않음
      - name: EC2에 배포
        run: |
          ssh -i ~/.ssh/deploy.pem ec2-user@${{ secrets.EC2_HOST }} bash -s <<'REMOTE'
          set -e
          cd ~/safety-paris-api
          git pull --ff-only
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull app
          docker logout ghcr.io
          docker compose up -d
          docker image prune -f
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/api/help-locations > /dev/null; then
              echo "배포 성공: 앱이 정상 응답"; exit 0
            fi
            sleep 3
          done
          echo "배포 실패: 앱이 2분 안에 응답하지 않음"; docker compose logs --tail 50 app; exit 1
          REMOTE
